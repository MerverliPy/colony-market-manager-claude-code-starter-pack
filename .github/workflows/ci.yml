name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-stub:
    name: Headless runtime stub
    runs-on: selfrunners

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.3 (headless)
        run: |
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot4
          godot4 --version

      - name: Run headless stub test
        run: godot4 --headless --script game/tests/test_stub.gd
        # Exit code from quit(0) must be 0 for CI to pass.